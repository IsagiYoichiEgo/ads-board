<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Доска объявлений: просмотр и публикация объявлений." />
    <title>Объявления</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <p class="eyebrow">Студенческая площадка</p>
        <h1>Доска объявлений</h1>
        <p>Находите нужное и размещайте свои объявления.</p>
      </header>

      <section class="panel" aria-labelledby="new-ad-title">
        <h2 id="new-ad-title">Новое объявление</h2>
        <form id="ad-form" novalidate>
          <label>Название<input name="title" type="text" maxlength="120" required /></label>
          <label>Описание<textarea name="description" rows="4" maxlength="1000" required></textarea></label>
          <label>Цена, сом<input name="price" type="number" min="0.01" step="0.01" inputmode="decimal" required /></label>
          <label>Изображение <span class="optional">необязательно</span><input name="image" type="file" accept="image/*" /></label>
          <button id="submit-button" type="submit">Опубликовать</button>
        </form>
        <p id="form-status" class="status" aria-live="polite" hidden></p>
      </section>

      <section class="ads-section" aria-labelledby="ads-title">
        <div class="section-heading"><h2 id="ads-title">Все объявления</h2><button id="retry-button" class="secondary" type="button" hidden>Повторить загрузку</button></div>
        <p id="list-status" class="status" aria-live="polite" hidden></p>
        <div id="ads-list" class="ads-grid" aria-live="polite"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
